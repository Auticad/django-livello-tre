{% extends "base.html" %}

{% block content %}

<h1>Homepage del Sito</h1>
<a href="{% url 'contact-page' %}">Contattaci</a>
|
<a href="/blog-post-editor/">Blog Post Editor</a>

<div class="mt-2">
  {% if not request.user.is_authenticated %}
  <a class="btn btn-sm btn-primary" href="{% url 'login' %}">Effettua il Login</a>
  <a class="btn btn-sm btn-primary ml-2" href="{% url 'register-account' %}">Registra Nuovo Account</a>
  {% else %}
  <form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}
    <input class="btn btn-sm btn-primary" type="submit" value="LOGOUT">
  </form>
  {% endif %}
</div>

{% endblock %}
